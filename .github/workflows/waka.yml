name: Hackatime Stats Update

on:
  schedule:
    # Runs automatically everyday at midnight
    - cron: '0 0 * * *'
  # Allows you to manually trigger it anytime
  workflow_dispatch: 

jobs:
  update-readme:
    name: Update Readme with Metrics
    runs-on: ubuntu-latest
    steps:
      - uses: athul/waka-readme@master
        with:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
          SHOW_TITLE: true
          SECTION_NAME: waka
